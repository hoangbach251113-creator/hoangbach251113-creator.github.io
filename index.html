<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Quản Trị Admin (Online Cloud)</title>
  
  <!-- Firebase App (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .admin-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .admin-title {
      color: #d9534f;
      margin-top: 0;
      font-size: 18px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 15px;
      color: #333;
      margin: 15px 0 10px 0;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    .input-control:focus {
      border-color: #0275d8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-red {
      background-color: #d9534f;
      color: white;
    }

    .btn-blue {
      background-color: #0275d8;
      color: white;
    }

    .divider {
      border: 0;
      border-top: 1px dashed #ccc;
      margin: 20px 0;
    }

    .result-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      font-size: 14px;
    }

    .result-box p {
      margin: 6px 0;
    }

    .details-pre {
      background: #fff;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 5px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <h3 class="admin-title">👤 BẢNG QUẢN TRỊ ADMIN (ONLINE CLOUD)</h3>

    <!-- 1. CỘNG TIỀN -->
    <div class="section-title"><b>1. Cộng số dư theo ID Tài Khoản:</b></div>
    <div class="input-group">
      <input type="number" id="admin-target-id" class="input-control" placeholder="Nhập ID Khách (VD: 1001)">
    </div>
    <div class="input-group">
      <input type="number" id="admin-add-amount" class="input-control" placeholder="Số tiền cộng (VNĐ)">
    </div>
    <button class="btn btn-red" onclick="adminCongTienTheoID()">+ Cộng Tiền Cloud</button>

    <hr class="divider">

    <!-- 2. CHECK ĐƠN HÀNG -->
    <div class="section-title"><b>2. Tra cứu chi tiết đơn hàng:</b></div>
    <div class="input-group">
      <input type="text" id="admin-check-order-id" class="input-control" placeholder="Nhập Mã đơn hàng...">
    </div>
    <button class="btn btn-blue" onclick="adminCheckDonHang()">🔍 Kiểm Tra Đơn Hàng</button>

    <!-- Kết quả hiển thị đơn hàng -->
    <div id="admin-order-result" class="result-box">
      <p><b>Mã đơn:</b> <span id="res-order-id" style="color: #0275d8;"></span></p>
      <p><b>ID Khách mua:</b> <span id="res-user-id" style="color: #d9534f; font-weight: bold;"></span></p>
      <p><b>Sản phẩm / Dịch vụ:</b> <span id="res-product-name" style="font-weight: bold;"></span></p>
      <p><b>Giá tiền:</b> <span id="res-price" style="color: #5cb85c; font-weight: bold;"></span> VNĐ</p>
      <p><b>Thời gian mua:</b> <span id="res-time"></span></p>
      <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #dee2e6;">
        <b>Nội dung / Chi tiết đơn hàng:</b>
        <pre id="res-details" class="details-pre"></pre>
      </div>
    </div>
  </div>

  <script>
    // ================= 1. CẤU HÌNH FIREBASE =================
    // Thay đổi thông tin cấu hình Firebase của bạn vào đây
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Khởi tạo Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Biến lưu thông tin danh sách users
    let users = {};

    // Lắng nghe dữ liệu users từ Firebase Realtime Database
    db.ref('users').on('value', (snapshot) => {
      users = snapshot.val() || {};
    });

    // ================= 2. HÀM CỘNG TIỀN =================
    function adminCongTienTheoID() {
      const targetId = parseInt(document.getElementById('admin-target-id').value);
      const amount = parseInt(document.getElementById('admin-add-amount').value);

      if (!targetId || !amount || amount <= 0) {
        return alert("Vui lòng nhập ID và Số tiền hợp lệ!");
      }

      let foundUserKey = null;
      for (let username in users) {
        if (users[username] && parseInt(users[username].id) === targetId) {
          foundUserKey = username;
          break;
        }
      }

      if (!foundUserKey) {
        return alert("Không tìm thấy ID " + targetId + " trên hệ thống Cloud!");
      }

      let newBalance = (users[foundUserKey].balance || 0) + amount;
      db.ref('users/' + foundUserKey + '/balance').set(newBalance).then(() => {
        alert("Cộng tiền thành công cho tài khoản: " + foundUserKey + " (ID: " + targetId + ")");
        document.getElementById('admin-target-id').value = '';
        document.getElementById('admin-add-amount').value = '';
      }).catch((error) => {
        console.error(error);
        alert("Lỗi khi cộng tiền!");
      });
    }

    // ================= 3. HÀM CHECK ĐƠN HÀNG =================
    function adminCheckDonHang() {
      const orderId = document.getElementById('admin-check-order-id').value.trim();
      const resultBox = document.getElementById('admin-order-result');

      if (!orderId) {
        alert("Vui lòng nhập Mã đơn hàng!");
        return;
      }

      db.ref('orders/' + orderId).once('value').then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();

          document.getElementById('res-order-id').innerText = orderId;
          document.getElementById('res-user-id').innerText = data.userId || data.idKhach || 'Không xác định';
          document.getElementById('res-product-name').innerText = data.productName || data.tenSanPham || 'Đơn hàng';
          document.getElementById('res-price').innerText = (data.price || data.gia || 0).toLocaleString('vi-VN');
          document.getElementById('res-time').innerText = data.time || data.thoiGian || 'Không rõ';

          const details = data.details || data.noiDung || data.code || JSON.stringify(data, null, 2);
          document.getElementById('res-details').innerText = details;

          resultBox.style.display = 'block';
        } else {
          alert("Không tìm thấy đơn hàng với mã này trên Cloud!");
          resultBox.style.display = 'none';
        }
      }).catch((error) => {
        console.error(error);
        alert("Lỗi kết nối CSDL khi tra cứu!");
      });
    }
  </script>
</body>
</html>
